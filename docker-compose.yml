# Local stack: app + Prometheus, Jaeger, Loki+Alloy, Grafana. `docker compose up --build`.
# Ports and URLs are listed in README.md.

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # H2 console, for this local stack only.
      - SPRING_PROFILES_ACTIVE=dev
      # Jaeger by compose service name; application.properties defaults to localhost
      # for running the app on the host.
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v3.9.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  # Log storage, on the image's baked-in single-binary config.
  loki:
    image: grafana/loki:3.7.4
    ports:
      - "3100:3100"

  # Log collector; Promtail's replacement. See observability/alloy/config.alloy.
  alloy:
    image: grafana/alloy:v1.18.0
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345" # Alloy's own debug/status UI
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
