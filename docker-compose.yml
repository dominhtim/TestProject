# Local observability stack: run the app plus Prometheus (metrics), Jaeger
# (traces), Loki+Alloy (logs), and Grafana (dashboards) together.
#
#   docker compose up --build
#
# Then visit:
#   App:        http://localhost:8080
#   Swagger UI: http://localhost:8080/swagger-ui.html
#   Prometheus: http://localhost:9090
#   Jaeger UI:  http://localhost:16686
#   Alloy UI:   http://localhost:12345  (log collector debug/status page)
#   Grafana:    http://localhost:3000  (login: admin / admin)

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Send traces to the Jaeger container by its service name (reachable
      # over the default compose network), rather than the localhost
      # default in application.properties (which assumes you're running
      # the app directly on your host while this stack runs in Docker).
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v3.9.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  # Log storage. Runs with its own baked-in single-binary config
  # (/etc/loki/local-config.yaml in the image) - filesystem storage, no auth,
  # which is all a local dev stack needs.
  loki:
    image: grafana/loki:3.7.4
    ports:
      - "3100:3100"

  # Log collector: discovers every container on the Docker daemon and ships
  # its stdout/stderr to Loki (see observability/alloy/config.alloy).
  # Grafana Alloy is the current recommended agent for this - Promtail (the
  # older tool for the same job) reached end-of-life in March 2026.
  alloy:
    image: grafana/alloy:v1.18.0
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345" # Alloy's own debug/status UI
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
