# Local development profile (SPRING_PROFILES_ACTIVE=dev), set by docker-compose.yml.
# Unsafe on any network you do not fully control - see SECURITY.md.

# A full H2 web client at /h2-console: arbitrary SQL, arbitrary JDBC target, no auth.
spring.h2.console.enabled=true

# Disables H2's own local-only check, which Docker's NAT would otherwise trip.
# A workaround, not a hardening measure.
spring.h2.console.settings.web-allow-others=true
