# ============================================================
# Local development profile  (SPRING_PROFILES_ACTIVE=dev)
# ============================================================
#
# Everything here is unsafe on any network you do not fully control. It is
# split out of application.properties so that the default profile - and so
# the image the Dockerfile builds - is the safe one, and enabling the
# console is a deliberate act rather than something to remember to undo.
#
# docker-compose.yml sets this profile for the local stack.

# A full H2 web client at /h2-console: arbitrary SQL, against whatever JDBC
# url/user/password the caller types into the login form. No authentication
# in front of it, and the taskdb credentials are in the README anyway.
spring.h2.console.enabled=true

# Docker publishes 8080 to the host, so browser requests reach the container
# via NAT rather than loopback and H2 refuses the console as non-local
# ("remote connections ('webAllowOthers') are disabled") without this. It
# turns off H2's own local-only check - it is not a hardening measure.
spring.h2.console.settings.web-allow-others=true
