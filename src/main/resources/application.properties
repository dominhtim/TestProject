spring.application.name=my-spring-app
server.port=8080

# ============================================================
# Concurrency
# ============================================================

# Each request runs on a virtual thread, so blocking JPA/JDBC code scales
# without a reactive rewrite. Requires Java 21+; we're on 25.
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# With the platform-thread ceiling gone, this pool is the real concurrency
# limit - HikariCP's default of 10 would just move the bottleneck here.
spring.datasource.hikari.maximum-pool-size=50

spring.jpa.hibernate.ddl-auto=create-drop

# show-sql writes unstructured text to stdout, which breaks the ECS JSON log
# format configured below and can echo row data. Use the logging levels
# instead when you need queries.
spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# No lazy-loaded associations here, so Open Session In View only holds a DB
# connection for the whole request and hides N+1 queries.
spring.jpa.open-in-view=false

# The H2 console is a generic JDBC client - the login form takes an arbitrary
# url/user/password, so it is not scoped to taskdb - and there is no Spring
# Security here to gate it. It now lives in application-dev.properties, along
# with the web-allow-others flag it needs behind Docker's NAT, so a deployment
# has to opt in with SPRING_PROFILES_ACTIVE=dev rather than remember to opt
# out. Explicit rather than relying on the framework default.
spring.h2.console.enabled=false

# Deliberately "never": these echo raw exception messages into response
# bodies. GlobalExceptionHandler supplies controlled problem+json instead,
# including the per-field errors include-binding-errors used to provide.
#
# Spring Boot 4 moved ErrorProperties from server.error.* to spring.web.error.*;
# the old keys are silently ignored.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

# ============================================================
# Pagination
# ============================================================

# Without max-page-size, ?size=1000000 is an unauthenticated way to make the
# server materialise the entire table.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ============================================================
# Observability
# ============================================================

# Never use "*" here - this app has no Spring Security configured, so
# anything exposed is reachable by anyone (see SECURITY.md re: CVE-2026-40976).
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never

# 100% locally so every request reaches Jaeger; turn down (e.g. 0.1) in production.
management.tracing.sampling.probability=1.0
# Local Jaeger container's OTLP/HTTP receiver (see docker-compose.yml).
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# ECS format includes trace_id/span_id once tracing is active, correlating
# logs with traces.
logging.structured.format.console=ecs

# ============================================================
# API Documentation (springdoc-openapi / Swagger UI)
# ============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
