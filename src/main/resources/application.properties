spring.application.name=my-spring-app
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Schema created on startup, dropped on shutdown - fine for an in-memory demo DB.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# This is a pure REST API with no lazy-loaded associations, so Open Session
# In View has nothing to help with - just holds a DB connection for the whole
# request and can hide N+1 queries. Disabled.
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

# Show the real error (message + validation errors) instead of Spring's bare
# {"status":400,"error":"Bad Request"} default. Fine for a demo app; a
# public-facing API would want this off to avoid leaking internal details.
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# Observability
# ============================================================

# Never use "*" here - this app has no Spring Security configured, so
# anything exposed is reachable by anyone (see SECURITY.md re: CVE-2026-40976).
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never

# Sample 100% of requests locally so every request shows up in Jaeger; turn
# this down (e.g. 0.1) in production.
management.tracing.sampling.probability=1.0
# Local Jaeger container's OTLP/HTTP receiver (see docker-compose.yml).
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Built into Spring Boot since 3.4. ECS format includes trace_id/span_id
# automatically once tracing is active, correlating logs with traces.
logging.structured.format.console=ecs

# ============================================================
# API Documentation (springdoc-openapi / Swagger UI)
# ============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
