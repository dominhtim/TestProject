spring.application.name=my-spring-app
server.port=8080

# --- Concurrency ---

# Blocking JPA/JDBC scales without a reactive rewrite.
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# With virtual threads, this pool is the real concurrency limit.
spring.datasource.hikari.maximum-pool-size=50

spring.jpa.hibernate.ddl-auto=create-drop

# Breaks the ECS JSON format and can echo row data; use the levels below instead.
spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# No lazy associations, so OSIV would only hold a connection and hide N+1s.
spring.jpa.open-in-view=false

# Off by default; the console lives in application-dev.properties so a deployment
# opts in rather than remembering to opt out. See CLAUDE.md.
spring.h2.console.enabled=false

# "never": these echo raw exception messages. GlobalExceptionHandler supplies
# controlled problem+json instead. Note the Boot 4 prefix rename - see CLAUDE.md.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never

# --- Pagination ---

# Without max-page-size, ?size=1000000 materialises the whole table.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Observability ---

# Never "*": no Spring Security, so anything exposed is reachable by anyone.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never

# 100% locally; turn down in production.
management.tracing.sampling.probability=1.0
# Local Jaeger's OTLP/HTTP receiver; compose overrides this.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# ECS carries trace_id/span_id once tracing is active.
logging.structured.format.console=ecs

# --- API Documentation (springdoc-openapi / Swagger UI) ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
